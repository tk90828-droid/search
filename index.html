<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>名單搜尋</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card: #121319;
      --muted: #9aa4af;
      --fg: #e8ecf1;
      --accent: #5eead4;
      --accent-2: #60a5fa;
      --border: #232635;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 800px at 20% -10%, rgba(94, 234, 212, 0.08), transparent),
                  radial-gradient(1000px 700px at 120% 10%, rgba(96, 165, 250, 0.08), transparent),
                  var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }
    .wrap {
      max-width: 1100px;
      margin: 40px auto 80px;
      padding: 0 20px;
    }
    .title {
      font-size: 28px;
      letter-spacing: .5px;
      margin-bottom: 12px;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 14px;
    }
    .search-card {
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.00));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
      backdrop-filter: blur(6px);
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, select, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0f1117;
      color: var(--fg);
      outline: none;
    }
    input::placeholder { color: #6b7280; }
    button {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #0b0c10;
      font-weight: 700;
      cursor: pointer;
      transition: transform .05s ease;
      border: none;
    }
    button:active { transform: translateY(1px); }
    .result-wrap {
      margin-top: 18px;
    }
    .result-head {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
    }
    .card {
      grid-column: span 12;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: grid;
      grid-template-columns: 120px 1fr 1fr 1fr;
      gap: 8px;
      align-items: center;
    }
    .card strong { color: var(--fg); }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #0b0c10;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 700;
    }
    .muted { color: var(--muted); font-size: 13px; }
    .empty {
      color: var(--muted);
      border: 1px dashed var(--border);
      padding: 16px;
      border-radius: 12px;
      text-align: center;
    }
    @media (max-width: 780px) {
      .row { grid-template-columns: 1fr; }
      .card { grid-template-columns: 1fr; gap: 6px; }
    }
  </style>
</head>

    const elName = document.getElementById('nameInput');
    const elIG   = document.getElementById('igInput');
    const elBtn  = document.getElementById('searchBtn');
    const elHead = document.getElementById('head');
    const elGrid = document.getElementById('grid');

    function normalize(s) {
      return (s || '').toString().trim().toLowerCase();
    }

    function renderRows(rows, leader) {
      elGrid.innerHTML = '';
      if (!rows.length) {
        elHead.textContent = '沒有找到相同桌長的成員。';
        elGrid.innerHTML = '<div class="empty">查無資料，請嘗試其他關鍵字或檢查拼字。</div>';
        return;
      }
      elHead.innerHTML = leader
        ? `桌長：<b>${leader || '—'}</b> 的成員（${rows.length} 筆）`
        : `成員（${rows.length} 筆）`;
      for (const r of rows) {
        const link = r.link ? `<a href="${r.link}" target="_blank" rel="noopener noreferrer">開啟連結</a>` : '<span class="muted">—</span>';
        const item = document.createElement('div');
        item.className = 'card';
        item.innerHTML = `
          <div><span class="muted">國家</span><br><strong>${r.country || '—'}</strong></div>
          <div><span class="muted">NAME</span><br><strong>${r.name || '—'}</strong></div>
          <div><span class="muted">IG</span><br><strong>${r.ig || '—'}</strong></div>
          <div><span class="muted">LINK</span><br>${link}</div>
        `;
        elGrid.appendChild(item);
      }
    }

    function search() {
      const qName = normalize(elName.value);
      const qIG   = normalize(elIG.value);

      let selected = null;
      if (qIG) {
        selected = DATA.find(r => normalize(r.ig) === qIG);
      }
      if (!selected && qName) {
        selected = DATA.find(r => normalize(r.name) === qName);
      }

      if (!selected) {
        const candidates = DATA.filter(r =>
          (qIG && normalize(r.ig).includes(qIG)) ||
          (qName && normalize(r.name).includes(qName))
        );
        if (candidates.length) {
          const leader = candidates[0].leader;
          const rows = DATA.filter(r => normalize(r.leader) === normalize(leader));
          rows.sort((a, b) => normalize(a.name).localeCompare(normalize(b.name)) || normalize(a.ig).localeCompare(normalize(b.ig)));
          renderRows(rows, leader);
        } else {
          renderRows([], '');
        }
        return;
      }

      const leader = selected.leader;
      const rows = DATA.filter(r => normalize(r.leader) === normalize(leader));
      rows.sort((a, b) => normalize(a.name).localeCompare(normalize(b.name)) || normalize(a.ig).localeCompare(normalize(b.ig)));
      renderRows(rows, leader);
    }

    elBtn.addEventListener('click', search);
    elName.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
    elIG.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
  </script>
